$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{vehicleID}}"
    description: ""
settings: {}
scripts:
  - type: afterResponse
    code: |-
      // Contract tests — Retrieve a vehicle (GET /vehicles/:id)
      const jsonData = pm.response.json();

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body is an object", function () {
          pm.expect(jsonData).to.be.an("object");
      });

      pm.test("Response contains id", function () {
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData.id).to.not.be.null;
      });

      pm.test("Response contains nickName as a string", function () {
          pm.expect(jsonData).to.have.property("nickName");
          pm.expect(jsonData.nickName).to.be.a("string");
      });

      pm.test("Response contains vin as a string", function () {
          pm.expect(jsonData).to.have.property("vin");
          pm.expect(jsonData.vin).to.be.a("string");
      });

      pm.test("Response contains make as a string", function () {
          pm.expect(jsonData).to.have.property("make");
          pm.expect(jsonData.make).to.be.a("string");
      });

      pm.test("Response contains model as a string", function () {
          pm.expect(jsonData).to.have.property("model");
          pm.expect(jsonData.model).to.be.a("string");
      });

      pm.test("Response contains year as a string", function () {
          pm.expect(jsonData).to.have.property("year");
          pm.expect(jsonData.year).to.be.a("string");
      });

      pm.test("Response contains miles", function () {
          pm.expect(jsonData).to.have.property("miles");
          pm.expect(jsonData.miles).to.not.be.null;
      });

      pm.test("Response contains no unexpected extra fields", function () {
          const allowedKeys = ["id", "nickName", "vin", "make", "model", "year", "miles"];
          Object.keys(jsonData).forEach(function (key) {
              pm.expect(allowedKeys).to.include(key);
          });
      });
    language: text/javascript
examples: ./.resources/Retrieve a vehicle.resources/examples
order: 2000
