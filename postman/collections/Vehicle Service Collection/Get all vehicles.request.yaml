$kind: http-request
url: "{{baseUrl}}/vehicles"
method: GET
headers:
  Accept: application/json
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Contract tests — Get all vehicles (GET /vehicles)
      const jsonData = pm.response.json();

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body is an array", function () {
          pm.expect(jsonData).to.be.an("array");
      });

      pm.test("Each vehicle has an id", function () {
          jsonData.forEach(function (vehicle) {
              pm.expect(vehicle).to.have.property("id");
              pm.expect(vehicle.id).to.not.be.null;
          });
      });

      pm.test("Each vehicle has nickName as a string", function () {
          jsonData.forEach(function (vehicle) {
              pm.expect(vehicle).to.have.property("nickName");
              pm.expect(vehicle.nickName).to.be.a("string");
          });
      });

      pm.test("Each vehicle has vin as a string", function () {
          jsonData.forEach(function (vehicle) {
              pm.expect(vehicle).to.have.property("vin");
              pm.expect(vehicle.vin).to.be.a("string");
          });
      });

      pm.test("Each vehicle has make as a string", function () {
          jsonData.forEach(function (vehicle) {
              pm.expect(vehicle).to.have.property("make");
              pm.expect(vehicle.make).to.be.a("string");
          });
      });

      pm.test("Each vehicle has model as a string", function () {
          jsonData.forEach(function (vehicle) {
              pm.expect(vehicle).to.have.property("model");
              pm.expect(vehicle.model).to.be.a("string");
          });
      });

      pm.test("Each vehicle has year as a string", function () {
          jsonData.forEach(function (vehicle) {
              pm.expect(vehicle).to.have.property("year");
              pm.expect(vehicle.year).to.be.a("string");
          });
      });

      pm.test("Each vehicle has miles", function () {
          jsonData.forEach(function (vehicle) {
              pm.expect(vehicle).to.have.property("miles");
              pm.expect(vehicle.miles).to.not.be.null;
          });
      });

      pm.test("Each vehicle contains no unexpected extra fields", function () {
          const allowedKeys = ["id", "nickName", "vin", "make", "model", "year", "miles"];
          jsonData.forEach(function (vehicle) {
              Object.keys(vehicle).forEach(function (key) {
                  pm.expect(allowedKeys).to.include(key);
              });
          });
      });
examples: ./.resources/Get all vehicles.resources/examples
order: 5000
